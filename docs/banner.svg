<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)" stroke="#263147" stroke-width="1.5"/>
  <rect width="900" height="240" rx="18" fill="url(#glow1)"/>
  <rect width="900" height="240" rx="18" fill="url(#glow2)"/>

  <!-- Top Tag -->
  <rect x="275" y="24" width="350" height="28" rx="14" fill="url(#pill)" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="450" y="42" fill="#a5b4fc" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    ⚡ GOOGLE SEARCH AI SPECIAL CHANNEL · OPEN-SOURCE GATEWAY
  </text>

  <!-- Main Title -->
  <text x="450" y="102" fill="url(#accent)" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Gemini 5.0 Proxy
  </text>

  <!-- Subtitle -->
  <text x="450" y="136" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15.5" font-weight="500" text-anchor="middle">
    “天道崩塌，谷狗封杀，我自一剑破之” —— 借道谷歌搜索引擎 AI 特殊渠道，直化标准 OpenAI 接口
  </text>

  <!-- 4 Feature Pills -->
  <g transform="translate(75, 168)">
    <rect x="0" y="0" width="175" height="38" rx="10" fill="#161f33" stroke="#2d3b55"/>
    <text x="87.5" y="24" fill="#34d399" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" text-anchor="middle">🟢 免 Google 账号防封</text>

    <rect x="190" y="0" width="175" height="38" rx="10" fill="#161f33" stroke="#2d3b55"/>
    <text x="277.5" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 原生实时联网搜索</text>

    <rect x="380" y="0" width="175" height="38" rx="10" fill="#161f33" stroke="#2d3b55"/>
    <text x="467.5" y="24" fill="#a5b4fc" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ 2.07s 极速直连响应</text>

    <rect x="570" y="0" width="175" height="38" rx="10" fill="#161f33" stroke="#2d3b55"/>
    <text x="657.5" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Vue 3 实时监控大盘</text>
  </g>
</svg>
